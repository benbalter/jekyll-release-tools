name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck bin/release-jekyll-gems test/stubs/*
          shellcheck -s bash test/test_helper.bash test/*.bats

  bats:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # macOS ships bash 3.2 at /bin/bash; test against it explicitly
          # since the runner puts a newer Homebrew bash first on PATH.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: bats
        env:
          BASH_UNDER_TEST: ${{ matrix.bash }}
        run: |
          "$BASH_UNDER_TEST" --version | head -n 1
          test/libs/bats-core/bin/bats test/
